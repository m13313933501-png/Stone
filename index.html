<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>秋招助手 · 大学生秋招聚合与简历匹配</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="site">
    <div class="wrap">
      <h1>秋招助手</h1>
      <p>聚合企业秋招需求 · 简历智能匹配 · 截止时间提醒</p>
    </div>
    <nav class="tabs">
      <button data-tab="jobs" class="active">岗位列表</button>
      <button data-tab="resume">我的简历</button>
      <button data-tab="watch">关注/日历</button>
    </nav>
  </header>

  <main>
    <section id="jobs" class="section active">
      <div id="soonBox"></div>
      <div class="toolbar">
        <input type="search" id="kw" placeholder="搜索岗位 / 公司 / 技能 / 城市" />
        <select id="industry"></select>
        <select id="city"></select>
        <label class="chk"><input type="checkbox" id="hideExpired" /> 隐藏已截止</label>
      </div>
      <div class="count" id="jobCount"></div>
      <div class="grid" id="jobList"></div>
    </section>

    <section id="resume" class="section">
      <div class="uploader" id="uploader">
        <p><strong>上传你的简历</strong>（PDF / DOCX）</p>
        <p>仅在本机浏览器解析与保存，不会上传任何服务器。</p>
        <input type="file" id="file" accept=".pdf,.docx" hidden />
        <button class="btn" id="pickBtn">选择文件</button>
        <p>或把文件拖到这里</p>
      </div>
      <div class="status" id="status"></div>
      <div id="skillsBox"></div>
      <div class="reco" id="recoBox"></div>
    </section>

    <section id="watch" class="section">
      <div class="reco">
        <h3>我关注的岗位</h3>
        <div id="watchList"></div>
        <button class="btn" id="exportIcs">导出日历提醒 (.ics)</button>
        <p style="color:var(--muted);font-size:12.5px;margin-top:10px">导出的 .ics 可导入手机/电脑日历，在截止前 3 天与 1 天收到提醒；投递入口与官网链接见各岗位详情。</p>
      </div>
    </section>
  </main>

  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modal"></div>
  </div>

  <footer class="site">
    数据来自公开秋招信息聚合，仅供参考，请以企业官方招聘渠道为准。本站不收集简历，所有解析均在你的浏览器本地完成。
  </footer>

  <!-- DOCX 解析（UMD，全局 mammoth） -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <!-- PDF 解析（ESM，暴露到 window.pdfjsLib） -->
  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.189/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.189/build/pdf.worker.min.mjs';
    window.pdfjsLib = pdfjsLib;
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
