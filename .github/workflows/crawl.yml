name: 每日爬取秋招数据
on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 ≈ 北京时间次日 02:00
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r crawler/requirements.txt

      - name: 运行爬虫
        run: python crawler/scraper.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/companies.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日秋招数据更新 $(date +%F)"
            git push
          fi
