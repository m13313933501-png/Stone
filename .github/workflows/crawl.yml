name: 每日爬取并部署秋招站点
on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 ≈ 北京时间次日 02:00
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write        # 提交每日数据
  pages: write           # 部署 Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r crawler/requirements.txt

      - name: 运行爬虫
        run: python crawler/scraper.py

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/companies.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日秋招数据更新 $(date +%F)"
            git push
          fi

      - name: 打包站点产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."     # 整个仓库即静态站点（index.html 在根目录）

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
