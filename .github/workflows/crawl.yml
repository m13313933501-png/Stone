name: 每日爬取并部署秋招站点

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 ≈ 北京时间次日 02:00
  workflow_dispatch: {}    # 支持手动触发（首次部署请点一次 Run workflow）

permissions:
  contents: write        # 提交每日数据
  pages: write           # 部署 Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r crawler/requirements.txt

      - name: 运行爬虫（秋招雷达聚合 + 种子合并）
        run: python crawler/qiuzhao_radar.py --delay 0.1

      - name: 巡检投递链接，剔除死链
        run: python crawler/check_links.py

      - name: 生成分片索引（首屏懒加载 / 分页）
        run: python crawler/build_index.py 500

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/companies.json data/meta.json data/index data/jd
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日秋招数据更新 $(date +%F)"
            git push
          fi

      - name: 打包站点产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."     # 整个仓库即静态站点（index.html 在根目录）

      - name: 启用 GitHub Pages（首次自动启用 / 已启用则幂等）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "尝试启用 Pages（build_type=workflow）…"
          curl -s -o /dev/null -w "POST /pages -> %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/$GH_REPO/pages"

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
